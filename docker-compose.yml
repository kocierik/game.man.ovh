services:
  game-server:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - caddy

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:?Set CADDY_NETWORK to the existing Caddy Docker network}
